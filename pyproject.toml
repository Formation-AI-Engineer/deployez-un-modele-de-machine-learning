[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deployez-un-modele-de-machine-learning"
version = "0.1.0"
description = "Déploiement d'un modèle de Machine Learning via une API FastAPI, PostgreSQL et CI/CD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lamine Camara" }]

dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # ML
    "scikit-learn>=1.5,<2.0",
    "catboost>=1.2,<2.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    # Database
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]  # Depends() / Query() in function defaults is standard FastAPI
