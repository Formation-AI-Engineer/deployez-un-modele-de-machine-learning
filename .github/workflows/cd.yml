name: CD — Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    name: Deploy Model to HF Spaces
    runs-on: ubuntu-latest
    # Only deploy when CI passes — CI runs on main push as well
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} || true
          git remote set-url hf https://huggingface.co/spaces/${{ secrets.HF_SPACE_ID }}
          git push https://user:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} main --force
